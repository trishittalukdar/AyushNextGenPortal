services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - CHOKIDAR_USEPOLLING=true
    # Server-side API keys only (non-VITE_ prefix → never exposed to the browser).
    # Platform delivers user-provided secrets here; the Vite dev middleware reads
    # them via process.env to run the search engine server-side.
    env_file:
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
